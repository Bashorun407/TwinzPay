version: '3.8'

services:
  # 1. Database Container (Hosts multiple isolated schemas)
  mysql-db:
    image: mysql:8.0
    container_name: twinzpay-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - TZ=Africa/Lagos
    ports:
      - "3307:3306"
    networks:
      - twinzpay-network

  # 2. Service Registry
  eureka-server:
    build:
      context: ./discovery-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - TZ=Africa/Lagos
    networks:
      - twinzpay-network

  # 3. API Gateway
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - TZ=Africa/Lagos
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    depends_on:
      - eureka-server
    networks:
      - twinzpay-network

  # 4. User Service (Isolated DB: user_db)
  user-service:
    build:
      context: ./user-service
    container_name: user-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/user_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - TZ=Africa/Lagos
      # Injected JWT Secrets
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
    depends_on:
      - mysql-db
      - eureka-server
    networks:
      - twinzpay-network

  # 5. Payment Service (Isolated DB: payment_db)
  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/payment_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - TZ=Africa/Lagos
      # Injected Paystack Secrets
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - APP_BASE_URL=https://germproof-oxford-untagged.ngrok-free.dev
    depends_on:
      - mysql-db
      - eureka-server
    networks:
      - twinzpay-network

  # 6. Scheduler Service (Isolated DB: scheduler_db)
  scheduler-service:
    build:
      context: ./scheduler-service
    container_name: scheduler-service
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/scheduler_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - TZ=Africa/Lagos
      # Injected Email App Password
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    depends_on:
      - mysql-db
      - eureka-server
      - payment-service
    networks:
      - twinzpay-network

  # 7. Utility Service (Isolated DB: utility_db)
  utility-service:
    build:
      context: ./utility-service
    container_name: utility-service
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/utility_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - TZ=Africa/Lagos
      # Injected Email App Password
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
    depends_on:
      - mysql-db
      - eureka-server
    networks:
      - twinzpay-network

  # Ngrok Tunnel
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_TOKEN}
      - TZ=Africa/Lagos
    command: http --url=germproof-oxford-untagged.ngrok-free.dev api-gateway:8080
    networks:
      - twinzpay-network

networks:
  twinzpay-network:
    driver: bridge